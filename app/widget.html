<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Position Summary</title>
<script src="https://live.zwidgets.com/js-sdk/1.0.5/ZohoEmbededAppSDK.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 13px;
    color: #1a1a1a;
    background: #ffffff;
    padding: 16px;
  }

  /* ---------- Header ---------- */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .header-title {
    font-size: 14px;
    font-weight: 600;
    color: #111;
    margin-bottom: 2px;
  }
  .header-sub {
    font-size: 12px;
    color: #666;
  }
  .refresh-btn {
    font-size: 12px;
    color: #555;
    background: none;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .refresh-btn:hover { background: #f5f5f5; }

  /* ---------- Summary cards ---------- */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 12px;
  }
  .card {
    background: #f7f7f7;
    border-radius: 8px;
    padding: 12px 14px;
  }
  .card-label {
    font-size: 11px;
    color: #777;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .card-value {
    font-size: 18px;
    font-weight: 600;
    color: #111;
    margin-bottom: 2px;
    word-break: break-all;
  }
  .card-meta {
    font-size: 11px;
    color: #999;
  }
  .card-note {
    font-size: 10px;
    color: #aaa;
    margin-top: 1px;
  }

  /* ---------- Net row ---------- */
  .net-row {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .net-card {
    flex: 1;
    background: #f7f7f7;
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .net-label { font-size: 12px; color: #666; }
  .net-value { font-size: 15px; font-weight: 600; }
  .positive { color: #1a7a56; }
  .negative { color: #c0392b; }

  /* ---------- Bar chart ---------- */
  .chart-box {
    border: 1px solid #e8e8e8;
    border-radius: 10px;
    padding: 16px;
  }
  .chart-label {
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 14px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-name {
    font-size: 12px;
    color: #555;
    width: 76px;
    flex-shrink: 0;
    text-align: right;
  }
  .bar-track {
    flex: 1;
    background: #f0f0f0;
    border-radius: 4px;
    height: 26px;
    position: relative;
    overflow: visible;
  }
  .bar-fill {
    height: 100%;
    border-radius: 4px;
    min-width: 4px;
    transition: width 0.5s ease;
    position: relative;
  }
  .bar-text-inside {
    position: absolute;
    right: 7px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
  }
  .bar-text-outside {
    position: absolute;
    left: calc(100% + 7px);
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    color: #555;
    white-space: nowrap;
  }

  /* ---------- Footer legend ---------- */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #eee;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: #777;
  }

  /* ---------- States ---------- */
  .state {
    text-align: center;
    padding: 40px 20px;
    color: #888;
    font-size: 13px;
  }
  .state-error { color: #c0392b; }

  /* ---------- Note ---------- */
  .note {
    font-size: 11px;
    color: #aaa;
    margin-top: 12px;
    text-align: right;
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">Financial position summary</div>
    <div class="header-sub" id="account-name">Loading&hellip;</div>
  </div>
  <button class="refresh-btn" onclick="init()">&#8635; Refresh</button>
</div>

<div id="content">
  <div class="state">Loading financial data&hellip;</div>
</div>

<script>
/* ── Colour map ────────────────────────────────────── */
var COLORS = {
  Loan_Assets:      '#1D9E75',
  Loan_Liabilities: '#E24B4A',
  Loan_Incomes:     '#378ADD',
  Loan_Expenses:    '#EF9F27'
};

var LABELS = {
  Loan_Assets:      'Assets',
  Loan_Liabilities: 'Liabilities',
  Loan_Incomes:     'Incomes',
  Loan_Expenses:    'Expenses'
};

/* Value fields per module (from Module_Information.xlsx) */
var VALUE_FIELDS = {
  Loan_Assets:      'Loan_Asset_Value',
  Loan_Liabilities: 'Liability_Amount',
  Loan_Incomes:     'Income_Amount',
  Loan_Expenses:    'Expense_Amount'
};

/* Modules where the value is a monthly figure */
var MONTHLY_MODULES = ['Loan_Incomes', 'Loan_Expenses'];

/* ── Formatting helpers ────────────────────────────── */
function fmtNZD(n) {
  return '$' + Math.round(n).toLocaleString('en-NZ');
}

/* ── Zoho API helpers ──────────────────────────────── */
function searchModule(moduleName, accountId) {
  return ZOHO.CRM.API.searchRecord({
    Entity:   moduleName,
    Type:     'criteria',
    Query:    '(Account:equals:' + accountId + ')',
    page:     1,
    per_page: 200
  });
}

function sumField(records, fieldName) {
  if (!records || !records.data) return 0;
  var total = 0;
  for (var i = 0; i < records.data.length; i++) {
    var val = parseFloat(records.data[i][fieldName]) || 0;
    total += val;
  }
  return total;
}

/* ── Render ────────────────────────────────────────── */
function render(accountName, totals) {
  document.getElementById('account-name').textContent = accountName;

  var assets      = totals.Loan_Assets;
  var liabilities = totals.Loan_Liabilities;
  var incomeMo    = totals.Loan_Incomes;
  var expenseMo   = totals.Loan_Expenses;
  var incomeAnn   = incomeMo * 12;
  var expenseAnn  = expenseMo * 12;
  var netWorth    = assets - liabilities;
  var netIncomeMo = incomeMo - expenseMo;

  var counts = totals.counts;
  var maxVal = Math.max(assets, liabilities, incomeAnn, expenseAnn, 1);

  var bars = [
    { key: 'Loan_Assets',      val: assets,     display: fmtNZD(assets),     pct: assets / maxVal },
    { key: 'Loan_Liabilities', val: liabilities, display: fmtNZD(liabilities), pct: liabilities / maxVal },
    { key: 'Loan_Incomes',     val: incomeAnn,  display: fmtNZD(incomeAnn) + ' p.a.', pct: incomeAnn / maxVal },
    { key: 'Loan_Expenses',    val: expenseAnn, display: fmtNZD(expenseAnn) + ' p.a.', pct: expenseAnn / maxVal }
  ];

  var barsHtml = bars.map(function(b) {
    var pctStr = Math.max(Math.round(b.pct * 100), 1) + '%';
    var wide   = b.pct > 0.35;
    var color  = COLORS[b.key];
    return '<div class="bar-row">' +
      '<div class="bar-name">' + LABELS[b.key] + '</div>' +
      '<div class="bar-track">' +
        '<div class="bar-fill" style="width:' + pctStr + ';background:' + color + '">' +
          (wide ? '<span class="bar-text-inside">' + b.display + '</span>' : '') +
        '</div>' +
        (!wide ? '<span class="bar-text-outside">' + b.display + '</span>' : '') +
      '</div>' +
    '</div>';
  }).join('');

  var legendHtml = [
    'Loan_Assets', 'Loan_Liabilities', 'Loan_Incomes', 'Loan_Expenses'
  ].map(function(k) {
    return '<div class="legend-item">' +
      '<div class="dot" style="background:' + COLORS[k] + '"></div>' +
      LABELS[k] + ': ' + counts[k] + ' record' + (counts[k] !== 1 ? 's' : '') +
    '</div>';
  }).join('');

  document.getElementById('content').innerHTML =
    '<div class="cards">' +
      '<div class="card">' +
        '<div class="card-label"><div class="dot" style="background:' + COLORS.Loan_Assets + '"></div>Assets</div>' +
        '<div class="card-value">' + fmtNZD(assets) + '</div>' +
        '<div class="card-meta">' + counts.Loan_Assets + ' record' + (counts.Loan_Assets !== 1 ? 's' : '') + '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-label"><div class="dot" style="background:' + COLORS.Loan_Liabilities + '"></div>Liabilities</div>' +
        '<div class="card-value">' + fmtNZD(liabilities) + '</div>' +
        '<div class="card-meta">' + counts.Loan_Liabilities + ' record' + (counts.Loan_Liabilities !== 1 ? 's' : '') + '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-label"><div class="dot" style="background:' + COLORS.Loan_Incomes + '"></div>Incomes</div>' +
        '<div class="card-value">' + fmtNZD(incomeMo) + '</div>' +
        '<div class="card-meta">' + counts.Loan_Incomes + ' record' + (counts.Loan_Incomes !== 1 ? 's' : '') + '</div>' +
        '<div class="card-note">monthly &bull; ' + fmtNZD(incomeAnn) + ' p.a.</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-label"><div class="dot" style="background:' + COLORS.Loan_Expenses + '"></div>Expenses</div>' +
        '<div class="card-value">' + fmtNZD(expenseMo) + '</div>' +
        '<div class="card-meta">' + counts.Loan_Expenses + ' record' + (counts.Loan_Expenses !== 1 ? 's' : '') + '</div>' +
        '<div class="card-note">monthly &bull; ' + fmtNZD(expenseAnn) + ' p.a.</div>' +
      '</div>' +
    '</div>' +

    '<div class="net-row">' +
      '<div class="net-card">' +
        '<span class="net-label">Net worth (assets &minus; liabilities)</span>' +
        '<span class="net-value ' + (netWorth >= 0 ? 'positive' : 'negative') + '">' + fmtNZD(netWorth) + '</span>' +
      '</div>' +
      '<div class="net-card">' +
        '<span class="net-label">Net monthly income</span>' +
        '<span class="net-value ' + (netIncomeMo >= 0 ? 'positive' : 'negative') + '">' + fmtNZD(netIncomeMo) + '/mo</span>' +
      '</div>' +
    '</div>' +

    '<div class="chart-box">' +
      '<div class="chart-label">Total by category</div>' +
      barsHtml +
      '<div class="legend">' + legendHtml + '</div>' +
    '</div>' +

    '<div class="note">Incomes &amp; Expenses shown as monthly totals. Bar chart uses annualised figures for scale comparison.</div>';
}

/* ── Bootstrap ─────────────────────────────────────── */
function init() {
  document.getElementById('content').innerHTML = '<div class="state">Loading financial data&hellip;</div>';

  ZOHO.embeddedApp.on('PageLoad', function(data) {
    var accountId   = data.EntityId;
    var accountName = data.Entity || 'Account';
    document.getElementById('account-name').textContent = accountName;

    var modules = ['Loan_Assets', 'Loan_Liabilities', 'Loan_Incomes', 'Loan_Expenses'];

    var promises = modules.map(function(mod) {
      return searchModule(mod, accountId);
    });

    Promise.all(promises).then(function(results) {
      var totals  = { counts: {} };
      var hasData = false;

      modules.forEach(function(mod, i) {
        var records    = results[i];
        var count      = (records && records.data) ? records.data.length : 0;
        var fieldName  = VALUE_FIELDS[mod];
        var rawTotal   = sumField(records, fieldName);

        totals[mod]          = rawTotal;
        totals.counts[mod]   = count;
        if (count > 0) hasData = true;
      });

      if (!hasData) {
        document.getElementById('content').innerHTML =
          '<div class="state">No financial records linked to this account yet.</div>';
        return;
      }

      render(accountName, totals);

    }).catch(function(err) {
      console.error('Widget error:', err);
      document.getElementById('content').innerHTML =
        '<div class="state state-error">Unable to load financial data. Please refresh or contact your administrator.</div>';
    });
  });

  ZOHO.embeddedApp.init();
}

init();
</script>
</body>
</html>
